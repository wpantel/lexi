<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 패, the first syllable of 패터, in one manuscript-paper square.
       The glyph is drawn as shapes so it looks the same without a Korean font,
       and sits on a 2-unit grid so it stays sharp at 16px. -->
  <rect x="1.5" y="1.5" width="29" height="29" fill="#fffdf8" stroke="#ea9462" stroke-width="3"/>
  <path d="M16 3v26M3 16h26" stroke="#fbe5d6"/>
  <g fill="#17131f">
    <!-- ㅍ -->
    <rect x="6" y="10" width="12" height="2"/>
    <rect x="6" y="20" width="12" height="2"/>
    <rect x="8" y="12" width="2" height="8"/>
    <rect x="14" y="12" width="2" height="8"/>
    <!-- ㅐ -->
    <rect x="20" y="8" width="2" height="16"/>
    <rect x="24" y="6" width="2" height="20"/>
    <rect x="22" y="14" width="2" height="2"/>
  </g>
</svg>
